<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2E7D32" />
  <title>Offline – SmartAgriSense</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-900: #1B5E20;
      --green-700: #2E7D32;
      --green-500: #4CAF50;
      --green-200: #C8E6C9;
      --green-50: #E8F5E9;
      --yellow-600: #F9A825;
      --bg: #F1F8E9;
      --text: #1B5E20;
      --text-muted: #558B2F;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }
    body::before {
      width: 400px; height: 400px;
      background: var(--green-500);
      top: -100px; left: -100px;
    }
    body::after {
      width: 350px; height: 350px;
      background: var(--yellow-600);
      bottom: -80px; right: -80px;
      animation-delay: 2s;
    }

    @keyframes float {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(46, 125, 50, 0.15);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 8px 32px rgba(27, 94, 32, 0.10),
        0 1px 3px rgba(0, 0, 0, 0.05);
    }

    /* Leaf icon */
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--green-700), var(--green-500));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(46, 125, 50, 0.3);
      animation: pulse 3s ease-in-out infinite;
    }
    .icon svg {
      width: 40px; height: 40px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(46, 125, 50, 0.3); }
      50%      { box-shadow: 0 4px 32px rgba(46, 125, 50, 0.5); }
    }

    .brand {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--green-500);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--green-900);
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--green-50);
      border: 1px solid var(--green-200);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      text-align: left;
      font-size: 0.9rem;
      color: var(--green-900);
      font-weight: 500;
    }
    .feature-icon {
      flex-shrink: 0;
      width: 32px; height: 32px;
      background: var(--green-700);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feature-icon svg {
      width: 18px; height: 18px;
      stroke: white;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--green-700), var(--green-500));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(46, 125, 50, 0.3);
    }
    .retry-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
    }
    .retry-btn:active { transform: translateY(0); }
    .retry-btn svg {
      width: 18px; height: 18px;
      stroke: white;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; border-radius: 20px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Leaf icon -->
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20c4 0 8.5-3 10-10z"/>
        <path d="M20.59 3.41A2 2 0 0 0 19 3H5a2 2 0 0 0-2 2v14c0 .55.22 1.05.59 1.41"/>
        <line x1="2" y1="2" x2="22" y2="22" opacity="0"/>
        <path d="M11 7.5L17 3"/>
      </svg>
    </div>

    <div class="brand">SmartAgriSense</div>
    <h1>You're Offline</h1>
    <p class="subtitle">Some features require an internet connection. Don't worry — key tools still work!</p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        Crop Calendar & Scheduling
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        Farm Management Tools
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        Advisory & Knowledge Base
      </div>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Try Again
    </button>

    <p class="footer">SmartAgriSense · AI-Powered Farming Advisory</p>
  </div>
</body>
</html>
